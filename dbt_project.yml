name: training

profile: default

seed-paths: ["seeds"]
model-paths: ["models"]
macro-paths: ["macros"]
clean-targets:
  - "target"
  - "dbt_packages"

seeds:
  # Builds seeds into '<your_schema_name>_raw'
  +schema: raw

models:
  staging:
    +materialized: view
  intermediate:
    +materialized: ephemeral
  marts:
    +materialized: table

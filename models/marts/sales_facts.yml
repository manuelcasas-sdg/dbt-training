version: 2

models:
  - name: fct_sales_lineitem
    description: "One row per order line, serving as the reconciliable base sales fact."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - orderkey
              - linenumber
    columns:
      - name: orderkey
        description: "Foreign key to the order."
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_tpch_sf1__orders')
                field: orderkey
      - name: linenumber
        description: "Line number within the order."
        tests:
          - not_null

  - name: fct_sales_daily
    description: "Sales metrics aggregated to order date."
    columns:
      - name: orderdate
        description: "The order date and grain of the model."
        tests:
          - unique
          - not_null

  - name: fct_sales_by_supplier
    description: "Sales metrics aggregated to supplier."
    columns:
      - name: suppkey
        description: "Primary key for the supplier aggregate."
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_tpch_sf1__supplier')
                field: suppkey

  - name: fct_sales_by_part
    description: "Sales metrics aggregated to part."
    columns:
      - name: partkey
        description: "Primary key for the part aggregate."
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_tpch_sf1__part')
                field: partkey

  - name: totals_by_customer
    description: "Customer sales summary aggregated directly from order-line sales."
    columns:
      - name: custkey
        description: "Primary key for the customer aggregate."
        tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('stg_tpch_sf1__customer')
                field: custkey
